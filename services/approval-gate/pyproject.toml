[project]
name = "tori-approval-gate"
version = "0.1.0"
description = "Gate de aprobación humana de TORI — recibe leadgen.message_drafted, expone una API de aprobar/rechazar, publica leadgen.lead_approved"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0,<6.0",
    "pydantic-settings>=2.2",
    "tori-seda-consumer",
    "tori-shared-types",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "fakeredis>=2.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["approval_gate*"]
