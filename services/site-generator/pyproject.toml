[project]
name = "tori-site-generator"
version = "0.1.0"
description = "Módulo 7 de TORI — genera y despliega un teaser de landing page (Vercel) antes del gate de aprobación humana, con cupo semanal y auto-expiración"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0,<6.0",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "tori-idempotency",
    "tori-seda-consumer",
    "tori-shared-types",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["site_generator*"]
