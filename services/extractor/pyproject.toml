[project]
name = "tori-extractor"
version = "0.1.0"
description = "Trigger Layer de TORI — dispara extracción de Google Maps y publica al Event Channel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "redis>=5.0,<6.0",
    "pydantic-settings>=2.2",
    "tori-idempotency",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
